name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        env:
            VERSION: ''
            RELEASE_TAG: ''

        steps:
            - uses: actions/checkout@v4

            - name: Get version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"
                  echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

            - name: Verify tag matches app version
              if: github.event_name == 'push'
              run: |
                  if [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match app version $VERSION"
                      exit 1
                  fi

            - name: Copy documentation
              run: cp ./*.md LICENSE site/

            - name: Create ZIP
              run: |
                  cd site
                  zip -r "../440-lab-${RELEASE_TAG}.zip" .

            - name: Upload test artifact
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: 440-lab-${{ env.RELEASE_TAG }}
                  path: 440-lab-${{ env.RELEASE_TAG }}.zip
                  if-no-files-found: error

            - name: Create release
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create \
                    "$RELEASE_TAG" \
                    "440-lab-${RELEASE_TAG}.zip" \
                    --generate-notes
